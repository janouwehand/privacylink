services:
  privacylinkslim:
    environment:
      Security__EmailVerificationHmacKey_FILE: /run/secrets/email_verification_hmac_key
      Resend__ApiKey_FILE: /run/secrets/resend_api_key
      Resend__FromAddress: "${PRIVACYLINK_RESEND_FROM_ADDRESS:?Set PRIVACYLINK_RESEND_FROM_ADDRESS to a verified sender address}"
    secrets:
      - email_verification_hmac_key
      - resend_api_key

secrets:
  email_verification_hmac_key:
    environment: PRIVACYLINK_EMAIL_VERIFICATION_HMAC_KEY
  resend_api_key:
    environment: PRIVACYLINK_RESEND_API_KEY
