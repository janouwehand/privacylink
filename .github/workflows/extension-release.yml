name: Chrome extension release
run-name: Release extension ${{ github.ref_name }}

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, verify, and attest extension package
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact-name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Check out selected release tag
        uses: actions/checkout@v7
      - name: Select and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'Build failed: release tag must be extension-vMAJOR.MINOR.PATCH (optional fourth component).' >&2
            exit 64
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=privacylink-extension-$version" >> "$GITHUB_OUTPUT"
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: src/PrivacyLink.Web/package-lock.json
      - name: Install npm 11.16
        run: npm install --global npm@11.16.0
      - name: Install frontend dependencies
        working-directory: src/PrivacyLink.Web
        run: npm ci
      - name: Run frontend and release guardrail tests
        working-directory: src/PrivacyLink.Web
        run: npm test
      - name: Build production website
        working-directory: src/PrivacyLink.Web
        run: npm run build -- --configuration production
      - name: Build production Manifest V3 extension
        working-directory: src/PrivacyLink.Web
        run: npm run build:extension
      - name: Verify packaged extension and tag version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/verify-extension-package.mjs src/PrivacyLink.Web/dist/privacy-link-extension/browser "$RELEASE_VERSION"
      - name: Create versioned extension archive
        id: archive
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          package_dir="$RUNNER_TEMP/extension-package"
          archive="$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          mkdir -p "$package_dir"
          cp -R src/PrivacyLink.Web/dist/privacy-link-extension/browser/. "$package_dir/"
          (cd "$package_dir" && zip -X -q -r "$archive" .)
          (cd "$RUNNER_TEMP" && sha256sum "$ARTIFACT_NAME.zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.sha256")
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest extension package build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Upload versioned extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ runner.temp }}/${{ steps.version.outputs.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 90

  submit:
    name: Sign, upload, and submit for Store review
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/extension-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: chrome-extension-store-submission
      queue: max
    environment:
      name: chrome-web-store-release
      url: https://chrome.google.com/webstore/devconsole
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release workflow scripts
        uses: actions/checkout@v7
      - name: Download attested extension package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-artifact
      - name: Check downloaded package checksum
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact-name }}
        run: (cd "$RUNNER_TEMP/release-artifact" && sha256sum --check "$ARTIFACT_NAME.sha256")
      - name: Extract and verify release package before signing
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact-name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/release-package"
          mkdir -p "$package_dir"
          unzip -q "$RUNNER_TEMP/release-artifact/$ARTIFACT_NAME.zip" -d "$package_dir"
          node scripts/verify-extension-package.mjs "$package_dir" "$RELEASE_VERSION"
      - name: Install Chrome for Verified CRX packaging
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Sign package with configured Verified CRX key
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          VERIFIED_CRX_PRIVATE_KEY: ${{ secrets.VERIFIED_CRX_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$VERIFIED_CRX_PRIVATE_KEY" ]]; then
            echo 'Signing failed: VERIFIED_CRX_PRIVATE_KEY is missing from the protected chrome-web-store-release environment.' >&2
            exit 78
          fi
          key_file="$RUNNER_TEMP/verified-crx-private-key.pem"
          umask 077
          printf '%s' "$VERIFIED_CRX_PRIVATE_KEY" > "$key_file"
          unset VERIFIED_CRX_PRIVATE_KEY
          "$CHROME_PATH" --no-first-run --no-default-browser-check \
            --pack-extension="$RUNNER_TEMP/release-package" \
            --pack-extension-key="$key_file"
          crx_file="$RUNNER_TEMP/release-package.crx"
          if [[ ! -s "$crx_file" ]]; then
            echo 'Signing failed: Chrome did not produce a non-empty CRX package.' >&2
            exit 1
          fi
          mv "$crx_file" "$RUNNER_TEMP/privacylink-extension-$RELEASE_VERSION.crx"
          echo "Signed CRX created for version $RELEASE_VERSION."
      - name: Upload signed CRX to Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_OAUTH_CLIENT_ID: ${{ secrets.CWS_OAUTH_CLIENT_ID }}
          CWS_OAUTH_CLIENT_SECRET: ${{ secrets.CWS_OAUTH_CLIENT_SECRET }}
          CWS_OAUTH_REFRESH_TOKEN: ${{ secrets.CWS_OAUTH_REFRESH_TOKEN }}
          CRX_FILE: ${{ runner.temp }}/privacylink-extension-${{ needs.package.outputs.version }}.crx
        run: node scripts/chrome-web-store.mjs upload "$CRX_FILE"
      - name: Submit uploaded package for Chrome Web Store review
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_OAUTH_CLIENT_ID: ${{ secrets.CWS_OAUTH_CLIENT_ID }}
          CWS_OAUTH_CLIENT_SECRET: ${{ secrets.CWS_OAUTH_CLIENT_SECRET }}
          CWS_OAUTH_REFRESH_TOKEN: ${{ secrets.CWS_OAUTH_REFRESH_TOKEN }}
        run: node scripts/chrome-web-store.mjs submit
      - name: Remove signing key file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/verified-crx-private-key.pem"
      - name: Record Store submission status
        if: success()
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          {
            echo "## Chrome Web Store submission"
            echo
            echo "Version `$RELEASE_VERSION` was uploaded and submitted to the Chrome Web Store API for review. This records a submission only; it does not mean Store review passed or that the version is live."
          } >> "$GITHUB_STEP_SUMMARY"
