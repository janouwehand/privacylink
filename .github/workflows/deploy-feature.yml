name: PrivacyLink feature branch deployment
run-name: Request deployment of ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish the image without deploying (for initial GHCR package visibility setup)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  request-deployment:
    name: Request trusted feature deployment
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record publish option
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: printf '%s\n' "$PUBLISH_ONLY" > publish-only.txt

      - name: Pass publish option to trusted workflow
        uses: actions/upload-artifact@v4
        with:
          name: feature-request-${{ github.run_id }}
          path: publish-only.txt
          if-no-files-found: error
          retention-days: 1
