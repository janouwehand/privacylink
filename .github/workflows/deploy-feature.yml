name: PrivacyLink feature deployment
run-name: Deploy feature branch ${{ inputs.source_branch }} to feature.privacylink.nl

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Feature branch to build and deploy
        required: true
        type: string
      publish_only:
        description: Publish the image without deploying (for initial GHCR package visibility setup)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate feature branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate feature branch name
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          if [[ "$SOURCE_BRANCH" == "main" ]] || ! git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null; then
            echo 'Provide a valid feature branch name other than main.' >&2
            exit 64
          fi
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.source_branch }}
      - name: Record selected feature commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish feature image
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Set feature image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-feature" >> "$GITHUB_OUTPUT"
      - name: Set feature version
        id: version
        run: echo "value=feature-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish feature image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:feature-sha-${{ needs.validate.outputs.source_sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-feature:
    name: Deploy and verify feature environment
    if: github.ref == 'refs/heads/main' && inputs.publish_only != true
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: feature
    concurrency:
      group: privacylink-feature
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the trusted workflow commit deployment scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Deploy feature image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: bash ./scripts/deploy-vps.sh feature "$IMAGE_REF"
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Run protocol smoke checks on feature environment
        run: node scripts/verify-prototype.mjs https://feature.privacylink.nl

  cleanup-ghcr:
    name: Retain recent feature images
    if: github.ref == 'refs/heads/main' && inputs.publish_only != true
    needs: deploy-feature
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete older feature package versions, keeping the latest 20
        uses: actions/delete-package-versions@v5
        with:
          package-name: privacylink-feature
          package-type: container
          min-versions-to-keep: 20
