name: PrivacyLink feature deployment
run-name: Deploy feature branch ${{ github.event.workflow_run.head_branch }} to feature.privacylink.nl

on:
  workflow_run:
    workflows:
      - PrivacyLink feature branch deployment
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Build and publish selected feature image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'feature/') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/deploy-feature.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      publish_only: ${{ steps.request.outputs.publish_only }}
    steps:
      - name: Download feature deployment request
        uses: actions/download-artifact@v4
        with:
          name: feature-request-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: feature-request

      - name: Validate feature deployment request
        id: request
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'The selected feature commit SHA is invalid.' >&2
            exit 64
          fi
          if [[ ! "$RUN_NUMBER" =~ ^[0-9]+$ || ! "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo 'The feature deployment run number is invalid.' >&2
            exit 64
          fi

          publish_only="$(cat feature-request/publish-only.txt)"
          if [[ "$publish_only" != true && "$publish_only" != false ]]; then
            echo 'The publish-only option must be true or false.' >&2
            exit 64
          fi
          echo "publish_only=$publish_only" >> "$GITHUB_OUTPUT"

      - name: Set feature image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-feature" >> "$GITHUB_OUTPUT"

      - name: Set feature version
        id: version
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: echo "value=feature-${RUN_NUMBER}.${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Check out selected feature commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish selected feature image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:feature-sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

  deploy-feature:
    name: Deploy and verify feature environment
    if: needs.publish.result == 'success' && needs.publish.outputs.publish_only != 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: feature
    concurrency:
      group: privacylink-feature
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted deployment scripts from main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Deploy feature image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: bash ./scripts/deploy-vps.sh feature "$IMAGE_REF"

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Run protocol smoke checks on feature environment
        run: node scripts/verify-prototype.mjs https://feature.privacylink.nl

  cleanup-ghcr:
    name: Retain recent feature images
    if: needs.deploy-feature.result == 'success'
    needs: deploy-feature
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete older feature package versions, keeping the latest 20
        uses: actions/delete-package-versions@v5
        with:
          package-name: privacylink-feature
          package-type: container
          min-versions-to-keep: 20
