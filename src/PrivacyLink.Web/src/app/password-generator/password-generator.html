<section class="generator" aria-labelledby="generator-title">
  <header class="generator-heading">
    <div><h2 id="generator-title">{{ language.t('generatorTitle') }}</h2></div>
    <button class="generator-close" type="button" [attr.aria-label]="language.t('close')" [title]="language.t('close')" (click)="close.emit()">×</button>
  </header>

  <div class="generator-type" role="group" [attr.aria-label]="language.t('generatorType')">
    <button type="button" [class.is-selected]="type() === 'pin'" [attr.aria-pressed]="type() === 'pin'" (click)="setType('pin')">{{ language.t('generatorPin') }}</button>
    <button type="button" [class.is-selected]="type() === 'password'" [attr.aria-pressed]="type() === 'password'" (click)="setType('password')">{{ language.t('generatorPassword') }}</button>
  </div>

  <section class="generator-settings" aria-labelledby="generator-settings-title">
    <h3 id="generator-settings-title">{{ language.t('generatorCustomize') }}</h3>
    <div class="generator-length">
      <label for="generator-length">{{ type() === 'pin' ? language.t('generatorDigits') : language.t('generatorCharacters') }}</label>
      <input id="generator-length" type="range" [min]="type() === 'pin' ? 4 : 8" [max]="type() === 'pin' ? 12 : 64" [value]="length()" (input)="updateLength($event)">
      <output for="generator-length">{{ length() }}</output>
    </div>
    @if (type() === 'password') {
      <div class="generator-options">
        <button type="button" class="generator-toggle" [class.is-on]="numbers()" role="switch" [attr.aria-checked]="numbers()" (click)="toggleOption('numbers')"><span>{{ language.t('generatorNumbers') }}</span><i aria-hidden="true"></i></button>
        <button type="button" class="generator-toggle" [class.is-on]="symbols()" role="switch" [attr.aria-checked]="symbols()" (click)="toggleOption('symbols')"><span>{{ language.t('generatorSymbols') }}</span><i aria-hidden="true"></i></button>
        <button type="button" class="generator-toggle" [class.is-on]="excludeAmbiguous()" role="switch" [attr.aria-checked]="excludeAmbiguous()" (click)="toggleOption('excludeAmbiguous')"><span>{{ language.t('generatorExcludeAmbiguous') }}</span><i aria-hidden="true"></i></button>
      </div>
    }
  </section>

  <section class="generator-result" aria-labelledby="generator-result-title">
    <h3 id="generator-result-title">{{ language.t('generatorResult') }}</h3>
    <div class="generator-value-row">
      <output class="generator-value" aria-live="polite">{{ value() }}</output>
      <div class="password-actions generator-icon-actions">
        <button class="password-action" type="button" [class.is-copied]="copied()" (click)="copy()" [attr.aria-label]="copied() ? language.t('passwordCopied') : language.t('copyPassword')" [title]="copied() ? language.t('passwordCopied') : language.t('copyPassword')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="1"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h3"></path></svg></button>
        <button class="password-action" type="button" [attr.aria-label]="language.t('generatorRefresh')" [title]="language.t('generatorRefresh')" (click)="generate()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4M4 5v4h4M4 13a8 8 0 0 0 14.9 4M20 19v-4h-4"></path></svg></button>
      </div>
    </div>
  </section>

  @if (copyFailed()) { <p class="error" role="alert">{{ language.t('clipboardFailure') }}</p> }
  @if (context === 'dialog') { <div class="generator-actions"><button class="primary" type="button" (click)="accept()">{{ language.t('generatorUse') }}</button></div> }
</section>
